<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1F3A68; --ink:#1A1D23; --muted:#5B616B; --line:#E1E4E9; --bg:#F6F7F9; --hot:#8A3B00; --hotbg:#FFE9D6; --late:#A3290F; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.4 Inter, system-ui, sans-serif; text-align:left }
  header { background:var(--navy); color:#fff; padding:20px 16px }
  header h1 { margin:4px 0 0; font-size:28px }
  main { max-width:640px; padding:12px 16px 40px }
  h2 { font-size:20px; margin:20px 0 8px }
  .card { display:block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px; color:inherit; text-decoration:none }
  .name { font-size:20px; font-weight:700; display:flex; justify-content:space-between; gap:8px }
  .tag { font-size:14px; font-weight:700; color:var(--hot); background:var(--hotbg); padding:4px 10px; border-radius:12px }
  .why { color:#3A3F48; margin-top:4px } .meta { color:var(--muted); font-size:15px; margin-top:4px }
  .row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid #EEF0F3 }
  .row input { width:24px; height:24px } .late { color:var(--late) }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 20px; border-radius:12px; border:0; background:var(--navy); color:#fff; font:600 17px Inter, sans-serif; cursor:pointer }
  input[type=email] { width:100%; min-height:52px; font-size:18px; padding:0 14px; border:1px solid #C9CED6; border-radius:12px; margin:8px 0 12px }
  .empty { color:var(--muted) }
</style>
</head>
<body>
<header><div id="today"></div><h1 id="hello">My Desk</h1></header>
<main id="app"></main>

<script type="module">
// My Desk — the agent's daily screen. Reads only what the database lets this agent see.
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

// Address and public key come from Vercel (set by the Supabase connection); the database rules do the protecting
const cfg = await fetch("/api/config").then(r => r.json());
if (!cfg.ok) { document.getElementById("app").textContent = "My Desk isn't connected yet. Email Tracy."; throw new Error(cfg.error); }
const sb = createClient(cfg.url, cfg.anonKey);
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

document.getElementById("today").textContent =
  new Date().toLocaleDateString("en-US", { weekday:"long", month:"short", day:"numeric", timeZone:"America/New_York" });

// Not signed in: one box, we email a sign-in link (no password)
async function showLogin() {
  app.innerHTML = `<h2>Sign in</h2><p>Type your Blue Ribbon email. We'll email you a link that signs you in.</p>
    <label for="em">Email</label><input type="email" id="em" autocomplete="email">
    <button class="btn" id="go">Email me a link</button><p id="msg"></p>`;
  document.getElementById("go").onclick = async () => {
    const email = document.getElementById("em").value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.href, shouldCreateUser:false } });
    document.getElementById("msg").textContent = error ? "That email isn't on the roster. Email Tracy." : "Check your email for the link.";
  };
}

// Signed in: hot leads first, then today's tasks
async function showDesk(user) {
  const { data: me } = await sb.from("agents").select("id, full_name").eq("auth_user_id", user.id).single();
  if (me) document.getElementById("hello").textContent = "Good morning, " + me.full_name.split(" ")[0];

  const { data: hot } = await sb.from("contacts")
    .select("id, first_name, last_name, hot_reason, source, created_at, pond_id")
    .eq("is_hot", true).order("hot_at", { ascending:false }).limit(20);

  const endOfDay = new Date(); endOfDay.setHours(23,59,59,999);
  const { data: tasks } = await sb.from("tasks")
    .select("id, title, due_at").eq("status","open").lte("due_at", endOfDay.toISOString()).order("due_at");

  app.innerHTML = `<h2>Call these first</h2>` +
    ((hot && hot.length) ? hot.map(c => `
      <div class="card"><div class="name"><span>${esc(c.first_name)} ${esc(c.last_name)}</span><span class="tag">HOT</span></div>
      <div class="why">${esc(c.hot_reason)}</div>
      <div class="meta">${esc(c.source || "Lead")}${c.pond_id ? " · office pond" : ""}</div></div>`).join("")
      : `<p class="empty">No hot leads right now.</p>`) +
    `<h2>Due today</h2>` +
    ((tasks && tasks.length) ? tasks.map(t => {
      const late = new Date(t.due_at) < new Date(new Date().toDateString());
      return `<div class="row"><input type="checkbox" id="t${t.id}" data-id="${t.id}">
        <label for="t${t.id}" class="${late ? "late" : ""}">${late ? "Overdue: " : ""}${esc(t.title)}</label></div>`;
    }).join("") : `<p class="empty">Nothing due today.</p>`);

  // Check a box = task done
  app.querySelectorAll("input[type=checkbox]").forEach(box => box.onchange = async () => {
    await sb.from("tasks").update({ status: box.checked ? "done" : "open" }).eq("id", box.dataset.id);
  });
}

const { data: { session } } = await sb.auth.getSession();
session ? showDesk(session.user) : showLogin();
sb.auth.onAuthStateChange((_e, s) => { if (s) showDesk(s.user); });
</script>
</body>
</html>
