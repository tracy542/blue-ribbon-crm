<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Blue Ribbon</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1F3A68; --navy2:#142847; --ink:#1A1D23; --muted:#5B616B; --line:#E1E4E9; --bg:#F4F5F7; --hot:#8A3B00; --hotbg:#FFE9D6; --late:#A3290F; --latebg:#FDE8E4; --ok:#1E6B3A; --side:#14213A; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 Inter, system-ui, sans-serif; text-align:left }
  a { color:var(--navy) }

  /* ---------- App shell: left menu + top bar + main panel ---------- */
  .shell { display:flex; min-height:100vh }
  .side { width:250px; flex:none; background:var(--side); color:#fff; display:flex; flex-direction:column; padding:18px 0 }
  .brand { padding:0 20px 18px; font-size:20px; font-weight:700; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px }
  .brand small { display:block; font-size:14px; font-weight:400; opacity:.75 }
  .navgroup { padding:10px 20px 4px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; opacity:.6 }
  .nav a { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 20px; min-height:48px; color:#fff; text-decoration:none; font-size:17px; border-left:4px solid transparent }
  .nav a:hover { background:rgba(255,255,255,.07) }
  .nav a.on { background:rgba(255,255,255,.12); border-left-color:#7FA8E8; font-weight:600 }
  .nav .count { font-size:14px; background:rgba(255,255,255,.18); border-radius:10px; padding:1px 9px }
  .side .foot { margin-top:auto; padding:16px 20px 0; font-size:15px; opacity:.8 }
  .side .foot a { color:#fff }
  .mainwrap { flex:1; min-width:0; display:flex; flex-direction:column }
  .topbar { display:flex; align-items:center; gap:14px; background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; flex-wrap:wrap }
  .topbar h1 { margin:0; font-size:24px; flex:1; min-width:160px }
  .topbar .search { flex:0 1 320px; min-width:180px }
  .menubtn { display:none; min-height:44px; padding:0 14px; border:1px solid #C9CED6; background:#fff; border-radius:10px; font:600 16px Inter, system-ui, sans-serif; cursor:pointer }
  .who { color:var(--muted); font-size:15px; white-space:nowrap }
  .tiles { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; padding:18px 24px 0 }
  .tile { display:block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; color:inherit; text-decoration:none; border-top:5px solid var(--navy) }
  .tile b { display:block; font-size:32px; line-height:1.1 }
  .tile span { color:var(--muted); font-size:15px }
  .tile.hot { border-top-color:#C25B12 } .tile.late { border-top-color:var(--late) } .tile.need { border-top-color:#2E6FD8 }
  .tile.on { outline:2px solid var(--navy) }
  main { padding:18px 24px 48px; max-width:1200px }

  /* ---------- Content pieces ---------- */
  h2 { font-size:20px; margin:22px 0 10px }
  h2:first-child { margin-top:4px }
  .cols { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:20px; align-items:start }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px }
  .panel > h2 { margin-top:0 }
  .card { display:block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; color:inherit; text-decoration:none }
  .panel .card { border-color:#ECEEF2 }
  .name { font-size:19px; font-weight:700; display:flex; justify-content:space-between; gap:8px; align-items:center }
  .tag { font-size:13px; font-weight:700; color:var(--hot); background:var(--hotbg); padding:3px 9px; border-radius:12px; white-space:nowrap }
  .tag.pond { color:var(--navy); background:#E3EAF5 } .tag.need { color:#1D4FA0; background:#E1ECFC }
  .why { color:#3A3F48; margin-top:3px } .meta { color:var(--muted); font-size:15px; margin-top:3px }
  .hotbar { color:var(--hot); background:var(--hotbg); padding:10px 12px; border-radius:10px; margin-top:8px }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px }
  .chip { padding:9px 14px; border-radius:22px; background:#fff; border:1px solid #C9CED6; color:var(--ink); font-size:16px; text-decoration:none; min-height:44px; display:inline-flex; align-items:center }
  .chip.on { border:2px solid var(--navy); color:var(--navy); font-weight:600 }
  /* lead table: columns on a computer, stacked on a phone */
  .tbl { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden }
  .tr { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr); gap:12px; padding:13px 16px; border-bottom:1px solid #EEF0F3; color:inherit; text-decoration:none; align-items:center }
  .tr:last-child { border-bottom:0 }
  a.tr:hover { background:#F7F9FC }
  .th { font-size:14px; font-weight:700; color:var(--muted); background:#FAFBFC; text-transform:uppercase; letter-spacing:.04em }
  .tr .nm { font-weight:700 }
  .row { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid #EEF0F3 }
  .row:last-child { border-bottom:0 }
  .box { background:#fff; border:1px solid var(--line); border-radius:12px }
  .row input[type=checkbox] { width:24px; height:24px; flex:none }
  .late { color:var(--late) }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:50px; padding:0 18px; border-radius:12px; border:0; background:var(--navy); color:#fff; font:600 17px Inter, system-ui, sans-serif; cursor:pointer; text-decoration:none }
  .btn.ghost { background:#fff; color:var(--navy); border:2px solid var(--navy) }
  .btn.small { min-height:44px; font-size:16px; padding:0 14px }
  .btns { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin:14px 0; max-width:520px }
  label { display:block; font-weight:600; margin:12px 0 4px }
  input[type=text], input[type=email], input[type=date], input[type=number], input[type=search], select, textarea { width:100%; min-height:46px; font:17px Inter, system-ui, sans-serif; padding:10px 12px; border:1px solid #C9CED6; border-radius:10px; background:#fff }
  textarea { min-height:110px }
  .empty { color:var(--muted) }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px }
  .stat b { display:block; font-size:30px }
  .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px }
  .msg { margin-top:10px; font-weight:600 } .msg.bad { color:var(--late) } .msg.good { color:var(--ok) }
  .note { color:var(--muted); font-size:15px }
  pre.mail { white-space:pre-wrap; font:16px/1.5 Inter, system-ui, sans-serif; background:#FAFBFC; border:1px solid var(--line); border-radius:12px; padding:14px; margin:6px 0 0 }
  .back { display:inline-block; font-size:16px; margin-bottom:6px }
  .narrow { max-width:720px }
  .tr.rr { grid-template-columns:minmax(0,2fr) minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.6fr) }
  .grid3 { display:grid; grid-template-columns:minmax(0,.7fr) minmax(0,1.6fr) minmax(0,1.2fr); gap:10px }
  label.ck { display:flex; align-items:center; gap:10px; font-weight:600; margin:14px 0 4px; min-height:44px }
  label.ck input { width:24px; height:24px; flex:none }

  /* ---------- My Blue Ribbon pieces ---------- */
  .uc { background:#FFD84D; color:#3A2C00; padding:14px 24px; font-size:19px; font-weight:700; border-bottom:2px solid #E0B400 }
  .uc span { display:block; font-size:15px; font-weight:400 }
  .switch { display:grid; grid-template-columns:1fr 1fr; margin:0 14px 12px; background:rgba(255,255,255,.08); border-radius:12px; padding:4px }
  .switch a { text-align:center; padding:10px 6px; border-radius:9px; color:#fff; text-decoration:none; font-size:15px; font-weight:600; opacity:.75 }
  .switch a.on { background:#fff; color:var(--side); opacity:1 }
  .brokerbar { background:#E8EEF8; border:1px solid #C9D6EC; border-radius:12px; padding:12px 16px; margin-bottom:14px }
  .pipe { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:16px }
  .pipe a { padding:12px 10px; text-decoration:none; color:inherit; border-right:1px solid #EEF0F3 }
  .pipe a:last-child { border-right:0 }
  .pipe b { display:block; font-size:28px; line-height:1.1 } .pipe span { color:var(--muted); font-size:14px }
  .pipe a.hot b { color:#C25B12 }
  .score { display:grid; grid-template-columns:minmax(0,1.1fr) repeat(5, minmax(0,1fr)); gap:10px; margin-bottom:16px }
  .score .s { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; text-decoration:none; color:inherit }
  .score .s b { display:block; font-size:28px; line-height:1.1 } .score .s span { color:var(--muted); font-size:14px }
  .score .big b { font-size:40px } .score .warn b { color:var(--late) }
  .crmgrid { display:grid; grid-template-columns:230px minmax(0,1fr); gap:16px; align-items:start }
  .filters { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px }
  .filters h3 { font-size:14px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px }
  .filters h3:first-child { margin-top:0 }
  .filters a { display:block; padding:7px 0; text-decoration:none; color:var(--ink) } .filters a.on { font-weight:700; color:var(--navy) }
  .tr.d7 { grid-template-columns:minmax(0,1.8fr) minmax(0,.7fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.1fr) }
  .tr.d5 { grid-template-columns:minmax(0,1.8fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) }
  .pill { display:inline-block; font-size:13px; font-weight:700; padding:3px 9px; border-radius:12px; background:#E3EAF5; color:var(--navy); white-space:nowrap }
  .stages { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px }
  .stages button { padding:10px 14px; border:1px solid #C9CED6; border-radius:10px; color:var(--ink); background:#fff; min-height:44px; font:16px Inter, system-ui, sans-serif; cursor:pointer }
  .stages button.on { background:var(--navy); color:#fff; border-color:var(--navy); font-weight:600 }
  .mtiles { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px }
  .mtile { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px }
  .mtile h3 { margin:0; font-size:19px } .mtile p { margin:0; color:#3A3F48 }
  .mtile .btn { margin-top:auto; align-self:flex-start } .mtile.soon { opacity:.6 } .mtile.soon .btn { background:#9AA3AF; cursor:default }
  .sechead { font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:22px 0 10px }
  .sechead:first-child { margin-top:0 }
  .modal { position:fixed; inset:0; background:rgba(10,16,30,.55); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto }
  .modal.open { display:flex } .modal .panel { width:min(560px,100%) }

  /* ---------- Phone: menu slides in, tiles 2x2, table stacks ---------- */
  @media (max-width: 860px) {
    .side { position:fixed; inset:0 auto 0 0; z-index:20; transform:translateX(-100%); transition:transform .2s; box-shadow:4px 0 20px rgba(0,0,0,.25) }
    .side.open { transform:none }
    .menubtn { display:inline-flex; align-items:center }
    .topbar { padding:10px 16px } .topbar h1 { font-size:22px } .topbar .search { flex:1 1 100% }
    .who { display:none }
    .tiles { grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; padding:14px 16px 0 }
    .tile b { font-size:28px }
    main { padding:14px 16px 48px }
    .cols { grid-template-columns:1fr }
    .tr { grid-template-columns:1fr; gap:2px } .th { display:none }
    .tr .c-stage, .tr .c-src { display:none }
    .tr.rr { grid-template-columns:1fr } .grid2, .grid3 { grid-template-columns:1fr }
    .uc { padding:12px 16px; font-size:17px }
    .pipe { grid-template-columns:repeat(4, minmax(0,1fr)) } .pipe a { border-bottom:1px solid #EEF0F3 }
    .score { grid-template-columns:repeat(2, minmax(0,1fr)) }
    .crmgrid { grid-template-columns:1fr } .crmgrid .filters { order:2 }
    .tr.d7, .tr.d5 { grid-template-columns:1fr } .mtiles { grid-template-columns:1fr }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Menu">
    <div class="brand">My Blue Ribbon<small>Blue Ribbon Real Estate</small></div>
    <div class="switch" id="switch" style="display:none"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="mainwrap">
    <div class="uc" id="uc">UNDER CONSTRUCTION<span>These screens are being built. Lead alerts, the office pond and the agent roster work today. On hold until Tracy finishes looking at Lone Wolf.</span></div>
    <div class="topbar">
      <button class="menubtn" id="menubtn" aria-label="Open menu">☰ Menu</button>
      <h1 id="title">Blue Ribbon CRM</h1>
      <input type="search" class="search" id="search" placeholder="Search name or email" aria-label="Search leads">
      <span class="who" id="who"></span>
    </div>
    <div class="tiles" id="tiles"></div>
    <main id="app"></main>
  </div>
</div>
<div class="modal" id="ucm" role="dialog" aria-modal="true" aria-labelledby="ucmT"><div class="panel" id="ucmBody"></div></div>

<script type="module">
// ============================================================
// Blue Ribbon CRM — app layout: left menu, top numbers, big main panel.
// Every read goes through the database's who-sees-what rules.
// ============================================================
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

const cfg = await fetch("/api/config").then(r => r.json());
if (!cfg.ok) { document.getElementById("app").textContent = "The CRM isn't connected yet. Email Tracy."; throw new Error(cfg.error); }
const sb = createClient(cfg.url, cfg.anonKey);

const $ = id => document.getElementById(id);
const app = $("app"), tilesEl = $("tiles"), navEl = $("nav"), side = $("side");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const TZ = "America/New_York";
const fmtDay = d => new Date(d).toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric", timeZone:TZ });
const fmtWhen = d => new Date(d).toLocaleString("en-US", { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZone:TZ });
const ago = d => { if (!d) return "never"; const m = Math.round((Date.now() - new Date(d)) / 60000);
  return m < 60 ? m + " min ago" : m < 1440 ? Math.round(m/60) + " hr ago" : Math.round(m/1440) + " days ago"; };
const fullName = c => (`${c.first_name || ""} ${c.last_name || ""}`).trim() || c.email || "No name";
// Follow Up Boss-style stages (stored codes kept from the first build: new_lead = Lead, active = Contacted, sphere = Nurture)
const STAGES = { new_lead:"Lead", active:"Contacted", appointment:"Appointment", showing:"Showing", client:"Client", under_contract:"Under contract", closed:"Closed", sphere:"Nurture", dead:"Dead" };
const STAGE_BTNS = ["new_lead","active","appointment","showing","under_contract","closed","sphere","dead"];
const money = v => v == null || v === "" ? "—" : "$" + Number(v).toLocaleString("en-US", { maximumFractionDigits:0 });
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString("en-US", { month:"2-digit", day:"2-digit", year:"numeric" }) : "—";
const DEAL_ST = { under_contract:"Under contract", closed:"Closed", fell_through:"Fell through" };
const SIDES = { buyer:"Buyer", listing:"Listing", both:"Both sides" };
// End and start of today in Eastern time, as real moments
const etNow = () => new Date(new Date().toLocaleString("en-US", { timeZone:TZ }));
const endOfToday = () => { const e = etNow(); const d = new Date(e); d.setHours(23,59,59,999); return new Date(Date.now() + (d - e)); };
const startOfToday = () => { const e = etNow(); const d = new Date(e); d.setHours(0,0,0,0); return new Date(Date.now() + (d - e)); };
const d30 = () => new Date(Date.now() - 30*86400000).toISOString();
const d7 = () => new Date(Date.now() - 7*86400000).toISOString();

let ME = null, PONDS = [], OFFICES = [], SET = { broker_message:"", links:{} };

$("menubtn").onclick = () => side.classList.toggle("open");
$("search").addEventListener("keydown", e => { if (e.key === "Enter") location.hash = "#/crm/all/" + encodeURIComponent(e.target.value.trim()); });

// ---------------- Sign in ----------------
function showLogin() {
  side.style.display = "none"; $("menubtn").style.display = "none"; $("search").style.display = "none"; tilesEl.innerHTML = "";
  $("title").textContent = "Blue Ribbon CRM";
  app.innerHTML = `<div class="narrow"><h2>Sign in</h2><p>Type your Blue Ribbon email. We'll email you a link that signs you in. No password.</p>
    <label for="em">Email</label><input type="email" id="em" autocomplete="email">
    <p><button class="btn" id="go">Email me a link</button></p><p id="msg" class="msg"></p></div>`;
  $("go").onclick = async () => {
    const email = $("em").value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin } });
    $("msg").textContent = error ? "Couldn't send the link. Wait a minute and try again, or email Tracy." : "Check your email for the link.";
  };
}

// ---------------- Left menu + top numbers ----------------
async function counts() {
  const mine = () => sb.from("contacts").select("id", { count:"exact", head:true }).eq("owner_agent_id", ME.id);
  const [need, hot, today, late, pond, crm] = await Promise.all([
    mine().is("first_contacted_at", null).not("stage","in","(closed,dead)"),
    mine().eq("is_hot", true),
    sb.from("tasks").select("id", { count:"exact", head:true }).eq("agent_id", ME.id).eq("status","open").gte("due_at", startOfToday().toISOString()).lte("due_at", endOfToday().toISOString()),
    sb.from("tasks").select("id", { count:"exact", head:true }).eq("agent_id", ME.id).eq("status","open").lt("due_at", startOfToday().toISOString()),
    sb.from("contacts").select("id", { count:"exact", head:true }).not("pond_id","is",null),
    mine(),
  ]);
  return { need:need.count||0, hot:hot.count||0, today:today.count||0, late:late.count||0, pond:pond.count||0, crm:crm.count||0 };
}

// Menu slots: each one opens our page, or a link the broker sets on Brokerage > Desk settings
const ME_MENU = [
  ["today", "#/", "Today"], ["crm", "#/crm", "My CRM"], ["desk", "#/desk", "My Commissions & Compliance Desk"],
  ["closed", "#/closed", "My Closed Properties"], ["marketing", "#/marketing", "My Marketing (Listings & Farming)"],
  ["tasks", "#/tasks", "My Tasks"], ["tools", "https://tools.ribbonway.com/home", "Tools"] ];
async function chrome(title, active) {
  $("title").textContent = title;
  side.classList.remove("open");
  tilesEl.innerHTML = "";
  const n = ME.staff ? { need:0, hot:0, today:0, late:0, pond:0, crm:0 } : await counts();
  const link = (h, label, key, count) => {
    const ext = h.startsWith("http");
    return `<a href="${esc(h)}" ${ext ? 'target="_blank" rel="noopener"' : ""} class="${active === key ? "on" : ""}">${label}${ext ? `<span class="count">↗</span>` : count ? `<span class="count">${count}</span>` : ""}</a>`; };
  const brokerSide = active.startsWith("a-") || active === "pond-b";
  // The "My Blue Ribbon | Brokerage" switch: broker and admin only
  const sw = $("switch");
  if (ME.boss) { sw.style.display = "";
    sw.innerHTML = `<a href="#/" class="${brokerSide ? "" : "on"}">My Blue Ribbon</a><a href="#/admin" class="${brokerSide ? "on" : ""}">Brokerage</a>`; }
  else sw.style.display = "none";
  const counts_ = { crm:n.need + n.hot, tasks:n.today + n.late };
  if (ME.staff) navEl.innerHTML = link("#/admin/agents", "Agent roster", "a-agents") + link("https://tools.ribbonway.com/home", "Tools") + link("https://cda.ribbonway.com", "CDA");
  else if (brokerSide) navEl.innerHTML =
      link("#/admin/agents", "Agent roster", "a-agents") + link("#/admin", "Who needs a nudge", "a-nudge") +
      link("#/admin/flow", "Lead routing", "a-flow") + link("#/admin/ponds", "Ponds", "pond-b", n.pond) +
      link("#/admin/plans", "Follow-up plans", "a-plans") + link("https://cda.ribbonway.com/compliance/", "Compliance") +
      link("#/admin/emails", "Held emails", "a-emails") + link("#/admin/desk", "Desk settings", "a-desk");
  else navEl.innerHTML = ME_MENU.map(([k, h, label]) => link(SET.links[k] || h, label, k, counts_[k])).join("");
  $("foot").innerHTML = `${esc(ME.full_name)}<br><a href="#" id="signout">Sign out</a>`;
  $("signout").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.hash = ""; location.reload(); };
  $("who").textContent = etNow().toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
}

const leadCard = c => `
  <a class="card" href="#/p/${c.id}">
    <div class="name"><span>${esc(fullName(c))}</span>${c.is_hot ? `<span class="tag">HOT</span>` : c.pond_id ? `<span class="tag pond">POND</span>` : !c.first_contacted_at ? `<span class="tag need">NEW</span>` : ""}</div>
    ${c.hot_reason ? `<div class="why">${esc(c.hot_reason)}</div>` : ""}
    <div class="meta">${esc(c.source || "Lead")} · came in ${ago(c.created_at)}</div>
  </a>`;

// ---------------- Today (home): broker message, pipeline strip, my deals, who to contact ----------------
async function stageCounts() {
  const mine = () => sb.from("contacts").select("id", { count:"exact", head:true }).eq("owner_agent_id", ME.id);
  const yr = new Date(etNow().getFullYear(), 0, 1).toISOString();
  const r = await Promise.all([ mine().eq("is_hot", true), mine().eq("stage","new_lead"), mine().eq("stage","active"),
    mine().eq("stage","appointment"), mine().in("stage",["showing","client"]),
    sb.from("deals").select("id", { count:"exact", head:true }).eq("agent_id", ME.id).eq("status","under_contract"),
    sb.from("deals").select("id", { count:"exact", head:true }).eq("agent_id", ME.id).eq("status","closed").gte("closed_at", yr) ]);
  return r.map(x => x.count || 0);
}

// ---------------- Tasks ----------------
async function taskList(box, todayOnly) {
  let q = sb.from("tasks").select("id, title, due_at, contact_id").eq("status","open").eq("agent_id", ME.id).order("due_at");
  if (todayOnly) q = q.lte("due_at", endOfToday().toISOString());
  const { data: tasks } = await q.limit(100);
  if (!tasks?.length) { box.innerHTML = `<p class="empty">${todayOnly ? "Nothing due today." : "No open tasks."}</p>`; return; }
  const sod = startOfToday();
  box.innerHTML = `<div class="box">` + tasks.map(t => {
    const late = new Date(t.due_at) < sod;
    return `<div class="row"><input type="checkbox" id="t${t.id}" data-id="${t.id}">
      <label for="t${t.id}" style="margin:0;font-weight:400;flex:1" class="${late ? "late" : ""}">${late ? "Overdue: " : ""}${esc(t.title)}${todayOnly ? "" : ` <span class="meta">· ${fmtDay(t.due_at)}</span>`}</label>
      ${t.contact_id ? `<a href="#/p/${t.contact_id}" style="white-space:nowrap">Open</a>` : ""}</div>`;
  }).join("") + `</div>`;
  box.querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = async () => {
    await sb.from("tasks").update({ status: cb.checked ? "done" : "open" }).eq("id", cb.dataset.id);
  });
}
async function showTasks() {
  await chrome("Tasks", "tasks");
  app.innerHTML = `<div class="narrow"><div id="tl"><p class="empty">Loading…</p></div></div>`;
  await taskList($("tl"), false);
}

const LISTS = { all:"All my people", need:"New & needs contact", hot:"Hot", new:"New this week", quiet:"No contact 30 days", noplan:"Not on a follow-up plan" };
async function crmScore() {
  const mine = () => sb.from("contacts").select("id", { count:"exact", head:true }).eq("owner_agent_id", ME.id);
  const in30 = new Date(Date.now() + 30*86400000).toLocaleDateString("en-CA", { timeZone:TZ });
  const [tot30, done30, need, hotRows, late, open, enr, closing] = await Promise.all([
    mine().gte("created_at", d30()), mine().gte("created_at", d30()).not("first_contacted_at","is",null),
    mine().is("first_contacted_at", null).not("stage","in","(closed,dead)"),
    sb.from("contacts").select("hot_at, last_contacted_at").eq("owner_agent_id", ME.id).eq("is_hot", true).limit(500),
    sb.from("tasks").select("id", { count:"exact", head:true }).eq("agent_id", ME.id).eq("status","open").lt("due_at", startOfToday().toISOString()),
    sb.from("contacts").select("id").eq("owner_agent_id", ME.id).not("stage","in","(closed,dead)").limit(2000),
    sb.from("enrollments").select("contact_id").eq("status","active").limit(5000),
    sb.from("deals").select("id", { count:"exact", head:true }).eq("agent_id", ME.id).eq("status","under_contract").lte("closing_date", in30) ]);
  const onPlan = new Set((enr.data || []).map(e => e.contact_id));
  return { score: tot30.count ? Math.round(100 * (done30.count || 0) / tot30.count) : null, need: need.count || 0,
    hotNeed: (hotRows.data || []).filter(c => !c.last_contacted_at || new Date(c.last_contacted_at) < new Date(c.hot_at)).length,
    late: late.count || 0, noPlan: (open.data || []).filter(c => !onPlan.has(c.id)).map(c => c.id), closing: closing.count || 0 };
}
async function showCrm(list = "all", term = "") {
  await chrome("My CRM", "crm");
  if (term) $("search").value = term;
  const sc = await crmScore();
  const sq = (h, cls, num, label) => `<a class="s ${cls}" href="${h}"><b>${num}</b><span>${label}</span></a>`;
  const f = (h, label, key) => `<a href="${h}" class="${key === list && !term ? "on" : ""}">${label}</a>`;
  app.innerHTML = `<div class="score">
      ${sq("#/crm/new", "big " + (sc.score != null && sc.score < 80 ? "warn" : ""), sc.score == null ? "—" : sc.score + "%", "Follow-up score · new leads contacted, last 30 days")}
      ${sq("#/crm/need", sc.need ? "warn" : "", sc.need, "New & needs contact")}
      ${sq("#/crm/hot", sc.hotNeed ? "warn" : "", sc.hotNeed, "Hot & needs contact")}
      ${sq("#/tasks", sc.late ? "warn" : "", sc.late, "Past-due tasks")}
      ${sq("#/crm/noplan", "", sc.noPlan.length, "Not on a follow-up plan")}
      ${sq("#/desk", "", sc.closing, "Closing in 30 days")}</div>
    <div class="crmgrid">
      <div class="filters"><h3>Saved views</h3>${Object.entries(LISTS).map(([k, v]) => f("#/crm/" + k, v, k)).join("")}
        <h3>Ponds</h3><a href="#/pond">Office pond — leads waiting</a>
        <h3>Stage</h3>${STAGE_BTNS.map(k => f("#/crm/s-" + k, STAGES[k], "s-" + k)).join("")}</div>
      <div>${term ? `<p class="note">Search: "${esc(term)}" · <a href="#/crm">clear</a></p>` : `<h2 style="margin-top:4px">${esc(list.startsWith("s-") ? STAGES[list.slice(2)] || "" : LISTS[list] || "")}</h2>`}
        <div id="tbl"><p class="empty">Loading…</p></div></div>
    </div>`;
  let q = sb.from("contacts").select("id, first_name, last_name, email, stage, source, is_hot, hot_reason, created_at, last_contacted_at, first_contacted_at, pond_id");
  if (term) q = q.or(`first_name.ilike.%${term}%,last_name.ilike.%${term}%,email.ilike.%${term}%`).order("created_at", { ascending:false });
  else {
    q = q.eq("owner_agent_id", ME.id);
    if (list === "need") q = q.is("first_contacted_at", null).not("stage","in","(closed,dead)").order("created_at", { ascending:false });
    else if (list === "hot") q = q.eq("is_hot", true).order("hot_at", { ascending:false });
    else if (list === "new") q = q.gte("created_at", d7()).order("created_at", { ascending:false });
    else if (list === "quiet") q = q.not("stage","in","(closed,dead)").or(`last_contacted_at.is.null,last_contacted_at.lt.${d30()}`).lt("created_at", d30()).order("last_contacted_at", { ascending:true, nullsFirst:true });
    else if (list === "noplan") q = q.in("id", sc.noPlan.slice(0, 300).length ? sc.noPlan.slice(0, 300) : ["00000000-0000-0000-0000-000000000000"]).order("created_at", { ascending:false });
    else if (list.startsWith("s-")) q = q.in("stage", list === "s-showing" ? ["showing","client"] : [list.slice(2)]).order("updated_at", { ascending:false });
    else q = q.order("created_at", { ascending:false });
  }
  const { data: rows } = await q.limit(200);
  if (!rows?.length) { $("tbl").innerHTML = `<p class="empty">Nobody in this list.</p>`; return; }
  $("tbl").innerHTML = `<div class="tbl"><div class="tr th"><span>Name</span><span>Stage</span><span>What's going on</span><span>Source</span><span>Last contact</span></div>` +
    rows.map(c => `<a class="tr" href="#/p/${c.id}">
      <span class="nm">${esc(fullName(c))} ${c.is_hot ? `<span class="tag">HOT</span>` : c.pond_id ? `<span class="tag pond">POND</span>` : !c.first_contacted_at ? `<span class="tag need">NEW</span>` : ""}</span>
      <span class="c-stage">${esc(STAGES[c.stage] || c.stage)}</span>
      <span class="why" style="margin:0">${esc(c.hot_reason || (c.first_contacted_at ? "" : "Not contacted yet"))}</span>
      <span class="c-src meta" style="margin:0">${esc(c.source || "")}</span>
      <span class="meta" style="margin:0">${c.last_contacted_at ? ago(c.last_contacted_at) : "Never"}</span></a>`).join("") + `</div>`;
}

// Stage change. "Under contract" asks for 3 things; the bots fill in the rest later.
async function setStage(id, stage, extra = {}) {
  const { data, error } = await sb.rpc("set_stage", { p_contact:id, p_stage:stage, ...extra });
  if (data?.ok) { $("ucm").classList.remove("open"); return showPerson(id); }
  const m = $("ucm").classList.contains("open") ? $("umsg") : $("smsg");
  m.className = "msg bad"; m.textContent = "Didn't save: " + (data?.error || error?.message || "try again");
}
function underContract(c) {
  $("ucmBody").innerHTML = `<h2 id="ucmT">Under contract — ${esc(fullName(c))}</h2>
    <p class="note">Three boxes. The rest (MLS #, paperwork, CDA) fills in from Bright, zipForm and dotloop.</p>
    <label for="u1">Property address</label><input type="text" id="u1" autocomplete="off">
    <label for="u2">Contract price</label><input type="text" id="u2" inputmode="numeric" placeholder="289000">
    <label for="u3">Closing date</label><input type="date" id="u3">
    <label for="u4">Side</label><select id="u4"><option value="buyer">Buyer</option><option value="listing">Listing</option><option value="both">Both sides</option></select>
    <p style="margin-top:16px"><button class="btn" id="usave">Save — add to my Desk</button> <button class="btn ghost" id="ucancel">Cancel</button></p><p id="umsg" class="msg"></p>`;
  $("ucm").classList.add("open"); $("u1").focus();
  $("ucancel").onclick = () => $("ucm").classList.remove("open");
  $("usave").onclick = () => {
    const price = Number(String($("u2").value).replace(/[^0-9.]/g, ""));
    setStage(c.id, "under_contract", { p_address:$("u1").value, p_price: price || null, p_close:$("u3").value || null, p_side:$("u4").value });
  };
}

const OFF_NAMES = { MBG:"Martinsburg", FR:"Front Royal", Bow:"Bowie", REF:"Referral", "":"No office" };
const ST_NAMES = { active:"Active", referral:"Referral", inactive:"Inactive" };
const pct = v => (v === null || v === undefined || v === "") ? "—" : `${v}%`;

async function rosterSyncNote() {

async function showAgents() {
  await chrome("Agent roster", "a-agents");
  app.innerHTML = `<p class="empty">Loading the roster…</p>`;
  const [{ data: rows, error }, { data: fl }] = await Promise.all([
    sb.from("roster").select("agent_id, first, last, email, phone, office, status, plan_name, split_pct, cda_split_pct, cda_arf_pct, pays_arf, in_cda_list, sync_state").order("last").order("first"),
    sb.from("roster_flags").select("agent_id, flags"),
  ]);
  if (error) { app.innerHTML = `<p class="msg bad">Couldn't load the roster: ${esc(error.message)}</p>`; return; }
  const flags = Object.fromEntries((fl || []).map(f => [f.agent_id, f.flags || []]));
  const n = st => rows.filter(r => r.status === st).length;
  const flaggedN = rows.filter(r => r.status !== "inactive" && (flags[r.agent_id] || []).length).length;
  const chip = (key, label) => `<a href="#" class="chip ${RF.st === key && !RF.flagged ? "on" : ""}" data-st="${key}">${label}</a>`;
  app.innerHTML = `${await rosterSyncNote()}
    <div class="chips">
      ${chip("active", `Active · ${n("active")}`)}${chip("referral", `Referral · ${n("referral")}`)}${chip("inactive", `Inactive · ${n("inactive")}`)}${chip("all", `All · ${rows.length}`)}
      <a href="#" class="chip ${RF.flagged ? "on" : ""}" data-fl="1">Needs a look · ${flaggedN}</a>
      <a class="btn small" href="#/admin/agents/new" style="margin-left:auto">Add an agent</a>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div><label for="rq">Find</label><input type="search" id="rq" placeholder="Name, email, phone or ID" value="${esc(RF.q)}"></div>
      <div><label for="ro">Office</label><select id="ro"><option value="">All offices</option>${["MBG","FR","Bow","REF"].map(o => `<option value="${o}" ${RF.off === o ? "selected" : ""}>${OFF_NAMES[o]}</option>`).join("")}</select></div>
    </div>
    <div class="tbl" id="rtbl"></div>`;
  const draw = () => {
    const q = RF.q.toLowerCase();
    const list = rows.filter(r =>
      (RF.flagged ? r.status !== "inactive" && (flags[r.agent_id] || []).length : RF.st === "all" || r.status === RF.st) &&
      (!RF.off || r.office === RF.off) &&
      (!q || `${r.first} ${r.last} ${r.email} ${r.phone} ${r.agent_id}`.toLowerCase().includes(q)));
    $("rtbl").innerHTML = `<div class="tr th rr"><span>Agent</span><span>Office</span><span>CDA split · ARF</span><span>Plan</span><span>Needs a look</span></div>` +
      (list.length ? list.map(r => {
        const f = flags[r.agent_id] || [];
        return `<a class="tr rr" href="#/admin/agents/${r.agent_id}">
          <span><span class="nm">${esc(`${r.first} ${r.last}`.trim())}</span>${r.status !== "active" ? ` <span class="tag pond">${ST_NAMES[r.status]}</span>` : ""}<div class="meta">${esc(r.agent_id)} · ${esc(r.email || "no email")}</div></span>
          <span>${esc(OFF_NAMES[r.office] || r.office)}</span>
          <span>${pct(r.cda_split_pct)} · ARF ${esc(arfText(r.cda_arf_pct))}${r.in_cda_list ? "" : `<div class="meta">not on CDA list</div>`}</span>
          <span>${esc(r.plan_name || "—")}</span>
          <span>${f.length ? `<span class="tag">${f.length}</span> <span class="meta">${esc(f[0])}</span>` : `<span class="meta">—</span>`}</span>
        </a>`; }).join("") : `<div class="row empty">No agents match.</div>`);
  };
  draw();
  app.querySelectorAll("[data-st]").forEach(a => a.onclick = e => { e.preventDefault(); RF.st = a.dataset.st; RF.flagged = false; showAgents(); });
  app.querySelector("[data-fl]").onclick = e => { e.preventDefault(); RF.flagged = true; showAgents(); };
  $("rq").oninput = e => { RF.q = e.target.value; draw(); };
  $("ro").onchange = e => { RF.off = e.target.value; draw(); };
}

    </div>
    <p style="margin-top:16px"><button class="btn" id="save">${isNew ? "Add agent" : "Save changes"}</button> <span id="smsg" class="msg"></span></p>
    ${isNew ? "" : `<p class="note">CDA dropdown: ${r.in_cda_list ? "on the list" : "not on the list"}${r.synced_at ? `, last sent ${esc(new Date(r.synced_at).toLocaleString("en-US", { timeZone:TZ }))}` : ""}${r.sync_state === "waiting" ? " · update waiting" : ""}${r.sync_state === "error" ? ` · <b class="late">last send failed: ${esc(r.sync_error)}</b>` : ""}. Last change ${esc(new Date(r.updated_at).toLocaleString("en-US", { timeZone:TZ }))} by ${esc(r.updated_by)}.</p>`}
    ${hist.length ? `<h2>Changes</h2><div class="box">${hist.map(h => `<div class="row" style="display:block"><b>${esc(new Date(h.at).toLocaleDateString("en-US", { timeZone:TZ }))}</b> · ${esc(h.by)}<div class="meta">${esc(Object.entries(h.changes).map(([k, c]) => k === "added" ? "added" : `${k}: ${fmtv(c.from)} → ${fmtv(c.to)}`).join("; "))}</div></div>`).join("")}</div>` : ""}`;

  $("addlic").onclick = () => { const d = document.createElement("div"); d.innerHTML = licRow({ state:"", number:"", exp:"" }, $("lics").children.length); $("lics").appendChild(d.firstElementChild); };
  $("save").onclick = async () => {
    const m = $("smsg"); m.className = "msg"; m.textContent = "Saving…";
    const num = x => x === "" ? null : Number(x);
    const lic = [...app.querySelectorAll(".lic")].map(el => ({ state: el.querySelector(".ls").value, number: el.querySelector(".ln").value.trim(), exp: el.querySelector(".le").value }))
      .filter(l => l.number);
    const rec = {
      first:$("f_first").value.trim(), last:$("f_last").value.trim(), email:$("f_email").value.trim(), phone:$("f_phone").value.trim(),
      office:$("f_office").value, status:$("f_status").value, mls_id:$("f_mls").value.trim(), hire_date:$("f_hire").value || null,
      brokersumo_id:$("f_bs").value.trim(), mailing:$("f_mail").value.trim(), not_in_brokersumo:$("f_nobs").checked, licenses:lic,
      notes:$("f_notes").value, cda_split_pct:$("f_cs").value.trim(), cda_arf_pct:$("f_ca").value.trim(),
      plan_name:$("f_plan").value.trim(), split_pct:num($("f_sp").value), net_pct:num($("f_np").value), pays_arf:$("f_arf").value,
      split_note:$("f_sn").value.trim(), split_review:$("f_sr").value.trim(), fee_override:$("f_fo").value.trim(),
    };
    // Keep blank-vs-empty exactly as the CDA list had it when nobody touched the field
    if (rec.cda_split_pct === "" && (r.cda_split_pct === null)) rec.cda_split_pct = null;
    if (rec.cda_arf_pct === "" && (r.cda_arf_pct === null)) rec.cda_arf_pct = null;
    if ($("f_ver").checked && !ver) rec.split_verified = { at:new Date().toISOString(), by:ME.full_name, note:"" };
    if (!$("f_ver").checked && ver) rec.split_verified = null;
    if (!rec.first || !rec.last) { m.className = "msg bad"; m.textContent = "First and last name are needed."; return; }
    if (rec.status !== "inactive" && !/^\S+@\S+\.\S+$/.test(rec.email)) { m.className = "msg bad"; m.textContent = "A working email is needed."; return; }
    if (rec.cda_split_pct && !/^\d+(\.\d+)?$/.test(rec.cda_split_pct)) { m.className = "msg bad"; m.textContent = "CDA split must be a number like 80 or 82.5."; return; }
    let res;
    if (isNew) {
      const aid = $("f_id").value.trim();
      if (!/^\d{7}$/.test(aid)) { m.className = "msg bad"; m.textContent = "Agent ID must be 7 digits."; return; }
      res = await sb.from("roster").insert({ agent_id:aid, ...rec, source:`Added in CRM by ${ME.full_name}` });
      if (!res.error) { location.hash = `#/admin/agents/${aid}`; return; }
    } else {
      res = await sb.from("roster").update(rec).eq("agent_id", r.agent_id);
    }
    if (res.error) { m.className = "msg bad"; m.textContent = res.error.message.includes("duplicate") ? "That agent ID is already on the roster." : `Couldn't save: ${res.error.message}`; return; }
    showAgentEdit(r.agent_id);
  };
}
const fmtv = x => x === null || x === undefined || x === "" ? "blank" : (typeof x === "object" ? (Array.isArray(x) ? `${x.length} item(s)` : "set") : String(x));

// ---------------- Router ----------------
async function route() {
  const h = location.hash || "#/";
  window.scrollTo(0, 0);
  if (h.startsWith("#/p/")) return showPerson(h.slice(4));
  if (h.startsWith("#/crm")) { const [, , list, term] = h.split("/"); return showCrm(list || "all", term ? decodeURIComponent(term) : ""); }
  if (h === "#/tasks") return showTasks();
  if (h === "#/pond") return showPond();
  if (h === "#/desk") return showDesk();
  if (h === "#/closed") return showClosed();
  if (h === "#/marketing") return showMarketing();
  if (h.startsWith("#/admin/agents/")) return (ME.boss || ME.staff) ? showAgentEdit(decodeURIComponent(h.slice(15))) : showToday();
  if (h.startsWith("#/admin/agents")) return (ME.boss || ME.staff) ? showAgents() : showToday();
  if (ME.staff) return showAgents();
  if (h.startsWith("#/admin")) {
    if (!ME.boss) return showToday();
    if (h === "#/admin/ponds") return showPond("pond-b");
    return ({ "#/admin":showBroker, "#/admin/flow":showFlow, "#/admin/plans":showPlans, "#/admin/emails":showEmails, "#/admin/agents":showAgents, "#/admin/desk":showDeskSettings }[h] || showBroker)();
  }
  return showToday();
}

async function start(user) {
  const { data: me } = await sb.from("agents").select("id, full_name, role, office_id").eq("auth_user_id", user.id).maybeSingle();
  if (!me) { side.style.display = "none"; tilesEl.innerHTML = ""; app.innerHTML = `<p>You're signed in, but your email isn't on the agent roster yet. Email Tracy.</p>`; return; }
  ME = { ...me, boss: me.role === "broker" || me.role === "admin", staff: me.role === "staff" };
  const { data: st } = await sb.from("app_settings").select("key, value").in("key", ["broker_message","desk_links"]);
  for (const r of st || []) { if (r.key === "broker_message") SET.broker_message = r.value;
    if (r.key === "desk_links") { try { SET.links = JSON.parse(r.value) || {}; } catch { SET.links = {}; } } }
  if (ME.staff) $("search").style.display = "none";
  [PONDS, OFFICES] = await Promise.all([ sb.from("ponds").select("id, name").order("name").then(r => r.data || []),
                                         sb.from("offices").select("id, name").order("name").then(r => r.data || []) ]);
  window.onhashchange = route;
  route();
}

const { data: { session } } = await sb.auth.getSession();
session ? start(session.user) : showLogin();
sb.auth.onAuthStateChange((evt, s) => { if (evt === "SIGNED_IN" && s && !ME) start(s.user); });
</script>
